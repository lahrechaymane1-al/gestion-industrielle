{% extends 'app/base_auth.html' %}

{% block content %}
<div class="card form-card">
    <h2>{{ page_title }}</h2>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="error-text">{{ form.non_field_errors }}</div>
        {% endif %}
        {% for field in form %}
            <div class="field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<span class="error-text">{{ field.errors|join:', ' }}</span>{% endif %}
            </div>
        {% endfor %}
        <div class="form-actions">
            <button class="primary-btn" type="submit">Enregistrer</button>
            <a href="{% url return_url_name %}" class="secondary-btn">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
